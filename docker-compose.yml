services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquatrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquatrack}
      POSTGRES_DB: ${POSTGRES_DB:-aquatrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquatrack} -d ${POSTGRES_DB:-aquatrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aquatrack};Username=${POSTGRES_USER:-aquatrack};Password=${POSTGRES_PASSWORD:-aquatrack}"
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-change-me}
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
